name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node dist/src/cli.js --version

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bundle for Workers (no Node built-ins allowed)
        run: npm run bundle:worker && ! grep -q '"node:' build/worker.js
      - name: wrangler deploy --dry-run
        working-directory: worker
        run: npx -y wrangler@4 deploy --dry-run --outdir ../build/wrangler
      - name: Smoke test on workerd (wrangler dev)
        run: node scripts/worker-smoke.mjs

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm pack
      - name: Install the tarball globally and run it
        run: |
          npm i -g ./hamyad-*.tgz
          mkdir /tmp/p && cd /tmp/p && git init -q
          hamyad init --project smoke
          hamyad add decision "Packaged CLI works"
          hamyad context | grep "Packaged CLI works"
      - uses: actions/upload-artifact@v4
        with:
          name: hamyad-tgz
          path: hamyad-*.tgz
