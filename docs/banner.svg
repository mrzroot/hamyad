<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280" role="img" aria-labelledby="t d">
  <title id="t">hamyad · هم‌یاد</title>
  <desc id="d">One shared memory for every AI on your project</desc>
  <defs>
    <clipPath id="card"><rect width="1280" height="280" rx="22"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14110f"/><stop offset="1" stop-color="#231c17"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d07be0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d07be0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f2a33a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>
  <style>
    .sweep { animation: sweep 6s ease-in-out infinite; }
    .orb1 { animation: drift 9s ease-in-out infinite alternate; }
    .orb2 { animation: drift 11s ease-in-out infinite alternate-reverse; }
    .rise { animation: rise 1.1s ease-out both; }
    .rise2 { animation: rise 1.1s .25s ease-out both; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes sweep { 0% { transform: translateX(-700px); } 100% { transform: translateX(1300px); } }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(40px,-18px); } }
    @keyframes rise { from { transform: translateY(10px); } to { transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .sweep, .orb1, .orb2, .rise, .rise2, .cursor { animation: none; }
      .sweep { opacity: 0; }
    }
  </style>
  <rect width="1280" height="280" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="280" rx="22" fill="url(#dots)"/>
  <g clip-path="url(#card)">
  <circle class="orb1" cx="1060" cy="250" r="170" fill="#d07be0" fill-opacity="0.10"/>
  <circle class="orb2" cx="180" cy="20" r="130" fill="#f2a33a" fill-opacity="0.08"/>
  </g>
  <g class="rise">
    <text x="60" y="140" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="84" font-weight="700" fill="#fbf3e8">hamyad<tspan class="cursor" fill="#d07be0">_</tspan></text>
    <text class="fa" x="1220" y="118" text-anchor="start" direction="rtl" font-family="Vazirmatn, Tahoma, 'Noto Sans Arabic', 'Segoe UI', sans-serif" font-size="44" font-weight="700" fill="#d07be0">هم‌یاد</text>
  </g>
  <g class="rise2">
    <text x="62" y="200" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#d9cbb8">One shared memory for every AI on your project</text>
  </g>
  <rect x="60" y="232" width="1160" height="2" fill="#ffffff" fill-opacity="0.08"/>
  <rect class="sweep" x="60" y="231" width="600" height="4" rx="2" fill="url(#sweep)"/>
</svg>
